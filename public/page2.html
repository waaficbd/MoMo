<!DOCTYPE html>
<html lang="ss">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoMo Eswatini - Kucela Imali Yekukhokha</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --momo-yellow: #ffcc00;
            --momo-yellow-hover: #e6b800;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation bar */
        .app-header {
            width: 100%;
            background-color: var(--momo-yellow);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
        }

        .header-title .momo { color: #000000; margin-right: 4px; }
        .header-title .eswatini { color: #000000; font-weight: 600; font-size: 15px; opacity: 0.85; }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: #000000;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #000000;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--momo-yellow);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        .form-control:focus {
            border-color: #cc9900;
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: none;
            height: 95px;
            font-family: inherit;
        }

        /* Button Styling */
        .btn-next {
            background-color: var(--momo-yellow);
            color: #000000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 15px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: var(--momo-yellow-hover);
        }

        .btn-next:active {
            opacity: 0.9;
        }

        /* Bottom Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Header Navigation Bar -->
<div class="app-header">
    <a href="/" class="back-btn">← Emuva</a>
    <div class="header-title">
        <span class="momo">MoMo</span><span class="eswatini">Eswatini</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Kucela Imali Yekukhokha</h1>
    <div class="subtext">Sinyatselo 1 kuya ku-3</div>

    <!-- Step Bar Progress Indicators -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Application Form -->
    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Luhlobo Lwemali Yekukhokha</label>
            <select id="loanType" class="form-control" required>
                <option value="Personal Loan" selected>Imali Yekutisebentisa</option>
                <option value="Business Loan">Imali Yebabhizinisi</option>
                <option value="Education Loan">Imali Yefundvo</option>
                <option value="Emergency Loan">Imali Yeticadza</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Linani Lemali (SZL)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="5000" value="5000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Sikhatsi Sekukhokha</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Months">Tinyanga letingu-6</option>
                <option value="12 Months" selected>Tinyanga letingu-12</option>
                <option value="18 Months">Tinyanga letingu-18</option>
                <option value="24 Months">Tinyanga letingu-24</option>
                <option value="36 Months">Tinyanga letingu-36</option>
                <option value="48 Months">Tinyanga letingu-48</option>
                <option value="60 Months">Tinyanga letingu-60</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Inhloso Yemali Yekukhokha</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Uyitsatsekela yini le Mali?" required></textarea>
        </div>

        <button type="submit" class="btn-next">SINYATSELO LESILANDZELAKO</button>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 MoMo Eswatini
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Retrieve stored calculations from previous step if available
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount') || localStorage.getItem('appliedAmount');
        const savedDuration = localStorage.getItem('loan_term') || localStorage.getItem('loanDuration') || localStorage.getItem('duration');

        if (savedAmount) {
            const digitsOnly = savedAmount.toString().replace(/\D/g, '');
            if (digitsOnly) {
                document.getElementById('loanAmt').value = digitsOnly;
            }
        }

        if (savedDuration) {
            const formattedDuration = savedDuration.toString().trim().toLowerCase();
            const selectEl = document.getElementById('loanTerm');
            
            for (let i = 0; i < selectEl.options.length; i++) {
                if (selectEl.options[i].value.toLowerCase().includes(formattedDuration) || formattedDuration.includes(selectEl.options[i].value.toLowerCase().replace(/\D/g, ''))) {
                    selectEl.selectedIndex = i;
                    break;
                }
            }
        }
    };

    function submitStep1(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;

        // Parse duration number (e.g. "12 Months" -> 12)
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        // Calculate monthly payment with 5% annual interest rate
        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        // Save data across all key variations to maintain storage compatibility
        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('appliedAmount', loanAmt);

        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);

        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        // Transition to Page 3
        window.location.href = "/page3"; 
    }
</script>

</body>
</html>
